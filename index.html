<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PHIL MD Dashboard</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f0f0; color: #333; font-size: 13px; }

    /* Header */
    .header { background: #3a8a84; color: white; padding: 12px 24px; display: flex; align-items: center; gap: 12px; }
    .header-logo { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
    .header-logo span { font-weight: 300; }
    .header-title { font-size: 15px; font-weight: 400; margin-left: 8px; }

    /* Filter bar */
    .filter-bar { background: white; border-bottom: 1px solid #e0e0e0; padding: 10px 24px; display: flex; align-items: center; gap: 12px; }
    .filter-label { font-size: 13px; color: #555; }
    .filter-select { border: 1px solid #ccc; border-radius: 4px; padding: 5px 10px; font-size: 13px; }

    /* Tabs */
    .tabs { background: white; border-bottom: 1px solid #e0e0e0; padding: 0 24px; display: flex; gap: 0; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { padding: 12px 14px; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; color: #666; display: flex; align-items: center; gap: 6px; }
    .tab:hover { color: #3a8a84; }
    .tab.active { color: #3a8a84; border-bottom-color: #3a8a84; font-weight: 500; }
    .tab-badge { background: #e05c5c; color: white; border-radius: 10px; padding: 1px 6px; font-size: 11px; font-weight: 700; line-height: 1.4; }
    .tab-divider { width: 1px; background: #e0e0e0; margin: 8px 6px; align-self: stretch; flex-shrink: 0; }
    .tab.tab-utility { color: #666; font-size: 12px; border-left: none; }
    .tab.tab-utility.active { color: #3a8a84; border-bottom-color: #3a8a84; }

    /* Page content */
    .page { max-width: 900px; margin: 0 auto; padding: 20px 16px 40px; }

    /* Summary card */
    .summary-meta { background: white; border: 1px solid #ddd; border-radius: 4px; padding: 20px 24px; margin-bottom: 12px; }
    .summary-meta h2 { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
    .summary-meta .meta { font-size: 13px; color: #555; }
    .summary-meta .meta span { margin-right: 16px; }

    .updated-line { font-size: 12px; color: #555; margin-bottom: 8px; }
    .summary-divider { border: none; border-top: 1px solid #eee; margin: 12px 0; }
    .info-banner { border-left: 3px solid #3a8a84; background: #f0fafa; padding: 10px 14px; margin: 12px 0 0; font-size: 13px; color: #3a8a84; }

    /* Section card */
    .section { background: white; border: 1px solid #ddd; border-radius: 4px; padding: 20px 24px; margin-bottom: 12px; }
    .section h3 { font-size: 14px; font-weight: 700; margin-bottom: 12px; }
    .section-subtitle { font-weight: 400; color: #555; }
    .empty-text { font-size: 13px; color: #888; }

    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { text-align: left; padding: 8px 10px; background: #f9f9f9; border: 1px solid #e5e5e5; color: #555; font-weight: 600; font-size: 12px; }
    td { padding: 10px 10px; border-bottom: 1px solid #f0f0f0; vertical-align: top; }
    .patient-name { font-weight: 600; margin-bottom: 1px; }
    .patient-dob { color: #777; font-size: 11px; }
    .cell-title { font-size: 12px; }
    .cell-detail { color: #888; font-size: 11px; margin-top: 2px; }
    .status-badge { display: inline-block; border: 1px solid #ccc; border-radius: 3px; padding: 2px 7px; font-size: 11px; color: #444; margin-bottom: 3px; }
    .pending-text { font-size: 11px; color: #888; }
    .action-label { font-weight: 600; margin-bottom: 6px; font-size: 12px; }
    .enter-btn { background: #3a8a84; color: white; border: none; border-radius: 3px; padding: 6px 14px; font-size: 12px; cursor: pointer; }

    /* Print button */
    .print-btn { display: block; margin: 0 auto 12px; background: white; color: #3a8a84; border: 1.5px solid #3a8a84; border-radius: 4px; padding: 10px 40px; font-size: 14px; font-weight: 500; cursor: pointer; }
    .print-btn:hover { background: #f0fafa; }

    @media print {
      .print-btn { display: none; }
      .header, .filter-bar, .tabs { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }

    /* ── Responsive / Mobile ─────────────────────────────────────────────── */
    /* Sticky top chrome */
    .sticky-chrome { position: sticky; top: 0; z-index: 100; }

    /* Tab scroll hint */
    .tabs-wrap { position: relative; }
    .tabs-wrap::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 40px; background: linear-gradient(to right, transparent, white 80%); pointer-events: none; }

    @media (max-width: 640px) {
      .page { padding: 12px 10px 40px; }
      .section { padding: 14px 12px; }
      .summary-meta { padding: 14px; }

      /* Card-style responsive tables */
      .rx-table { display: block; }
      .rx-table thead { display: none; }
      .rx-table tbody { display: block; }
      .rx-table tr { display: block; border: 1px solid #e8e8e8; border-radius: 6px; margin-bottom: 10px; padding: 12px 14px; background: #fff; }
      .rx-table td { display: block; border: none; padding: 2px 0; font-size: 13px; }
      .rx-table td[data-label]::before { content: attr(data-label); display: block; font-size: 10px; font-weight: 700; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
      .rx-table .patient-name { font-size: 14px; }
      .rx-table .enter-btn { margin-top: 10px; width: 100%; padding: 10px; font-size: 14px; }
      .rx-table .status-badge { font-size: 12px; padding: 3px 8px; }

      /* Filter bar */
      .filter-bar { padding: 8px 12px; }
      .filter-select { font-size: 14px; padding: 6px 10px; flex: 1; }

      /* Full-screen modal on mobile */
      .modal-backdrop { align-items: flex-end; }
      .modal-box { width: 100%; max-width: 100%; border-radius: 16px 16px 0 0; padding: 24px 20px 32px; max-height: 90vh; overflow-y: auto; }

      /* Stats row stacks tighter */
      .stats-row { gap: 8px !important; }
      .stats-row > div { min-width: 52px !important; }

      /* Print button */
      .print-btn { width: 100%; }
    }

    @media (min-width: 641px) and (max-width: 900px) {
      .page { padding: 16px 14px 40px; }
      .section { padding: 16px 18px; }
      .rx-table { display: block; }
      .rx-table thead { display: none; }
      .rx-table tbody { display: block; }
      .rx-table tr { display: block; border: 1px solid #e8e8e8; border-radius: 6px; margin-bottom: 10px; padding: 12px 16px; }
      .rx-table td { display: block; border: none; padding: 2px 0; }
      .rx-table td[data-label]::before { content: attr(data-label); display: block; font-size: 10px; font-weight: 700; color: #aaa; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px; }
      .rx-table .enter-btn { margin-top: 8px; }
      .modal-box { width: 460px; }
    }

    /* Modal */
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1000; display: flex; align-items: center; justify-content: center; }
    .modal-box { background: white; border-radius: 8px; width: 360px; max-width: calc(100vw - 32px); padding: 28px 28px 24px; position: relative; box-shadow: 0 8px 32px rgba(0,0,0,0.18); }
    .modal-close { position: absolute; top: 14px; right: 16px; background: none; border: none; font-size: 20px; color: #999; cursor: pointer; line-height: 1; padding: 0; }
    .modal-close:hover { color: #333; }
    .modal-title { font-size: 16px; font-weight: 700; color: #222; margin-bottom: 20px; }
    .modal-field { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; font-size: 13px; }
    .modal-field-label { color: #555; font-weight: 600; }
    .modal-field-value { color: #222; }
    .modal-divider { border: none; border-top: 1px solid #eee; margin: 16px 0; }
    .modal-input { width: 100%; border: 1.5px solid #d5d5d5; border-radius: 4px; padding: 10px 12px; font-size: 14px; font-family: inherit; color: #333; margin-bottom: 12px; }
    .modal-input:focus { outline: none; border-color: #3a8a84; }
    .modal-input.error { border-color: #e05c5c; background: #fff5f5; }
    .modal-input:disabled { background: #f5f5f5; color: #aaa; cursor: not-allowed; }
    .modal-checkbox-row { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 16px; font-size: 12px; color: #555; }
    .modal-checkbox-row input { margin-top: 2px; accent-color: #3a8a84; flex-shrink: 0; cursor: pointer; }
    .modal-submit { width: 100%; background: #3a8a84; color: white; border: none; border-radius: 4px; padding: 12px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .modal-submit:hover { background: #2d7070; }
    .modal-submit:disabled { background: #bbb; cursor: default; }
    .modal-error { font-size: 12px; color: #e05c5c; margin-bottom: 10px; }

    /* Success */
    .success-state { text-align: center; padding: 32px 0 16px; }
    .success-icon { font-size: 44px; margin-bottom: 12px; }
    .success-state h4 { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
    .success-state p { font-size: 13px; color: #666; line-height: 1.6; max-width: 380px; margin: 0 auto; }
  </style>
</head>

    function EnterPhoneModal({ patient, onClose, onSubmitted }) {
      const [phone, setPhone] = useState("");
      const [isLandline, setIsLandline] = useState(false);
      const [submitting, setSubmitting] = useState(false);
      const [error, setError] = useState("");
      const [done, setDone] = useState(false);

      const isValidPhone = v => /^[\d\s\-\(\)\.]{7,}$/.test(v.trim());

      const handleSubmit = async () => {
        if (!isLandline && !isValidPhone(phone)) {
          setError("Please enter a valid mobile number.");
          return;
        }
        setError("");
        setSubmitting(true);
        try {
          await trackEvent("1234567890", "enter_phone", {
            patient_name: patient.name,
            dob: patient.dob,
            phone: isLandline ? null : phone.trim(),
            is_landline: isLandline,
          });
        } catch (_) {}
        setSubmitting(false);
        setDone(true);
        setTimeout(() => { onSubmitted && onSubmitted(); onClose(); }, 1200);
      };

      const handleBackdrop = e => { if (e.target === e.currentTarget) onClose(); };

      return (
        <div className="modal-backdrop" onClick={handleBackdrop}>
          <div className="modal-box">
            <button className="modal-close" onClick={onClose}>✕</button>
            <div className="modal-title">Update Patient's Contact Information</div>
            <div className="modal-field">
              <span className="modal-field-label">Patient Name</span>
              <span className="modal-field-value">{patient.name.split(", ").reverse().join(" ")}</span>
            </div>
            <div className="modal-field">
              <span className="modal-field-label">Date of Birth</span>
              <span className="modal-field-value">{patient.dob}</span>
            </div>
            <hr className="modal-divider" />
            {done ? (
              <div style={{textAlign:"center",padding:"12px 0 4px",color:"#3a8a84",fontWeight:600,fontSize:"14px"}}>✓ Contact information updated.</div>
            ) : (<>
              <input
                className={`modal-input ${error ? "error" : ""}`}
                type="tel"
                placeholder="Enter mobile number"
                value={isLandline ? "" : phone}
                disabled={isLandline}
                onChange={e => { setPhone(e.target.value); setError(""); }}
                autoFocus
              />
              {error && <p className="modal-error">{error}</p>}
              <div className="modal-checkbox-row">
                <input type="checkbox" id="landline-check" checked={isLandline}
                  onChange={e => { setIsLandline(e.target.checked); setPhone(""); setError(""); }} />
                <label htmlFor="landline-check">
                  The patient does not have a mobile phone number. The number provided is a landline.
                </label>
              </div>
              <button className="modal-submit" disabled={submitting} onClick={handleSubmit}>
                {submitting ? "Submitting…" : "Submit"}
              </button>
            </>)}
          </div>
        </div>
      );
    }

                              <td data-label="Status"><div className="status-badge">{r.status}</div><div className="pending-text">Pending: {r.pending}</div></td>
                              <td data-label="Patient"><div className="patient-name">{r.name}</div><div className="patient-dob">DOB: {r.dob}</div></td>
                              <td data-label="Medication">{medLabel(r)}</td>
                              <td data-label="Action"><button className="enter-btn" onClick={() => setPhoneModalPatient(r)}>Update Number</button></td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    );
                  })()}
                </div>

                <div id="section-pending-patient" className="section">
                  <h3>Pending Patient Actions</h3>
                  <p style={{fontSize:"12px",color:"#3a8a84",marginBottom:"12px"}}>We recommend reaching out to the patient for additional information.</p>
                  {rx.pendingPatient.length === 0 ? <p className="empty-text">No prescriptions to display.</p> : (
                    <table className="rx-table">
                      <thead><tr><th>Reason</th><th>Patient Info</th><th>Medication</th><th>Additional Details</th></tr></thead>
                      <tbody>
                        {rx.pendingPatient.map((r, i) => (
                          <tr key={i}>
                            <td data-label="Reason"><div className="cell-title">{r.reason}</div></td>
                            <td data-label="Patient"><div className="patient-name">{r.name}</div><div className="patient-dob">DOB: {r.dob}</div></td>
                            <td data-label="Medication">{medLabel(r)}</td>
                            <td data-label="Details"><div className="cell-title">{r.detail}</div>{r.sub && <div className="cell-detail">{r.sub}</div>}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                </div>

                <div id="section-in-process" className="section">
                  <h3>Prescriptions in Process</h3>
                  {rx.inProcess.length === 0 ? <p className="empty-text">No prescriptions to display.</p> : (
                    <table className="rx-table">
                      <thead><tr><th>Patient Info</th><th>Medication</th><th>Status</th><th>Additional Details</th></tr></thead>
                      <tbody>
                        {rx.inProcess.map((r, i) => (
                          <tr key={i}>
                            <td data-label="Patient"><div className="patient-name">{r.name}</div><div className="patient-dob">DOB: {r.dob}</div></td>
                            <td data-label="Medication">{medLabel(r)}</td>
                            <td data-label="Status"><div className="status-badge">{r.status}</div></td>
                            <td data-label="Details"><div className="cell-detail">{r.detail}</div></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                </div>

                <div id="section-shipped" className="section">
                  <h3>Successfully Shipped Prescriptions</h3>
                  {rx.shipped.length === 0 ? <p className="empty-text">No prescriptions to display.</p> : (
                    <table className="rx-table">
                      <thead><tr><th>Patient Info</th><th>Medication</th><th>Processing Details</th><th>Details</th></tr></thead>
                      <tbody>
                        {rx.shipped.map((r, i) => (
                          <tr key={i}>
                            <td data-label="Patient"><div className="patient-name">{r.name}</div><div className="patient-dob">DOB: {r.dob}</div></td>
                            <td data-label="Medication">{medLabel(r)}</td>
                            <td data-label="Processing"><div className="cell-title">{r.payType}</div>{r.insurance && <div className="cell-detail">Insurance: {r.insurance}</div>}</td>
                            <td data-label="Details"><div className="cell-title">{r.detail}</div></td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                </div>

                <div id="section-transferred" className="section">
                  <h3>Transferred Prescriptions</h3>
                  {rx.transferred.length === 0 ? <p className="empty-text">No prescriptions to display.</p> : (
                    <table className="rx-table">
                      <thead><tr><th>Patient Info</th><th>Medication</th><th>Additional Details</th></tr></thead>
                      <tbody>
                        {rx.transferred.map((r, i) => (
                          <tr key={i}>
                            <td data-label="Patient"><div className="patient-name">{r.name}</div><div className="patient-dob">DOB: {r.dob}</div></td>
                            <td data-label="Medication">{medLabel(r)}</td>
                            <td data-label="Details">{r.note}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                </div>

                <div id="section-canceled" className="section">
                  <h3>Canceled Prescriptions</h3>
                  {rx.canceled.length === 0 ? <p className="empty-text">No prescriptions to display.</p> : (
                    <table className="rx-table">
                      <thead><tr><th>Patient Info</th><th>Medication</th><th>Reason</th><th>Date</th></tr></thead>
                      <tbody>
                        {rx.canceled.map((r, i) => (
                          <tr key={i}>
                            <td data-label="Patient"><div className="patient-name">{r.name}</div><div className="patient-dob">DOB: {r.dob}</div></td>
                            <td data-label="Medication">{medLabel(r)}</td>
                            <td data-label="Reason">{r.reason}</td>
                            <td data-label="Date">{r.date}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  )}
                </div>
              </>);
            })()}

            <button className="print-btn" onClick={() => { trackEvent("1234567890", "print", { url: window.location.href }); window.print(); }}>Print</button>
          </div>
        </div>
      );
    }

    // ── Access gate ────────────────────────────────────────────────────────
    const ACCESS_CODE = "PHIL2026";
    const SESSION_KEY = "hcp_demo_auth";

    function AccessGate({ onUnlock }) {
      const [code, setCode] = useState("");
      const [error, setError] = useState(false);
      const submit = () => {
        if (code.trim().toUpperCase() === ACCESS_CODE) {
          localStorage.setItem(SESSION_KEY, "1");
          onUnlock();
        } else {
          setError(true);
          setCode("");
        }
      };
      return (
        <div style={{minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"#f0f0f0"}}>
          <div style={{background:"white",borderRadius:"10px",padding:"40px 36px",width:"320px",boxShadow:"0 8px 32px rgba(0,0,0,0.12)",textAlign:"center"}}>
            <div style={{fontSize:"28px",fontWeight:800,color:"#3a8a84",marginBottom:"4px"}}>PHIL<span style={{fontWeight:300}}>Rx</span></div>
            <div style={{fontSize:"13px",color:"#777",marginBottom:"28px"}}>MD Dashboard · Demo Access</div>
            <input
              type="password"
              placeholder="Enter access code"
              value={code}
              autoFocus
              onChange={e => { setCode(e.target.value); setError(false); }}
              onKeyDown={e => e.key === "Enter" && submit()}
              style={{width:"100%",border:`1.5px solid ${error ? "#e05c5c" : "#d5d5d5"}`,borderRadius:"6px",padding:"10px 14px",fontSize:"14px",marginBottom:"8px",fontFamily:"inherit",outline:"none",background:error?"#fff5f5":"white"}}
            />
            {error && <p style={{fontSize:"12px",color:"#e05c5c",marginBottom:"8px"}}>Incorrect access code. Please try again.</p>}
            <button onClick={submit} style={{width:"100%",background:"#3a8a84",color:"white",border:"none",borderRadius:"6px",padding:"11px",fontSize:"14px",fontWeight:600,cursor:"pointer"}}>
              Access Demo
            </button>
            <p style={{fontSize:"11px",color:"#aaa",marginTop:"16px"}}>For authorized PHIL team members only.</p>
          </div>
        </div>
      );
    }

    function DeviceFrame({ children }) {
      const params = new URLSearchParams(window.location.search);
      const view = params.get("view");
      if (!view) return children;

      const frames = {
        mobile: { w: 390, h: 844, label: "iPhone 14", radius: "44px", icon: "📱" },
        tablet: { w: 768, h: 1024, label: "iPad",     radius: "20px", icon: "📲" },
      };
      const f = frames[view];
      if (!f) return children;

      const baseUrl = window.location.origin + window.location.pathname;

      return (
        <div style={{background:"#1a1a2e",minHeight:"100vh",padding:"24px 20px 40px",display:"flex",flexDirection:"column",alignItems:"center",gap:"16px"}}>
          <div style={{display:"flex",gap:"20px",alignItems:"center",flexShrink:0,flexWrap:"wrap",justifyContent:"center"}}>
            <span style={{color:"white",fontWeight:700,fontSize:"14px"}}>{f.icon} {f.label}</span>
            <a href={baseUrl} style={{color:"#888",textDecoration:"none",fontSize:"13px",border:"1px solid #444",borderRadius:"4px",padding:"4px 10px"}}>🖥 Desktop</a>
            {view !== "mobile" && <a href={`${baseUrl}?view=mobile`} style={{color:"#888",textDecoration:"none",fontSize:"13px",border:"1px solid #444",borderRadius:"4px",padding:"4px 10px"}}>📱 Mobile</a>}
            {view !== "tablet" && <a href={`${baseUrl}?view=tablet`} style={{color:"#888",textDecoration:"none",fontSize:"13px",border:"1px solid #444",borderRadius:"4px",padding:"4px 10px"}}>📲 Tablet</a>}
          </div>
          <div style={{
            width: f.w + 24,
            border: "12px solid #2a2a2a",
            borderRadius: f.radius,
            boxShadow: "0 0 0 2px #444, 0 28px 72px rgba(0,0,0,0.75)",
            overflow: "hidden",
            background: "#000",
            flexShrink: 0,
          }}>
            <iframe
              src={baseUrl}
              width={f.w}
              height={f.h}
              style={{display:"block",border:"none"}}
              title={`${f.label} Preview`}
            />
          </div>
        </div>
      );
    }

    function Root() {
      const [authed, setAuthed] = useState(!!localStorage.getItem(SESSION_KEY));
      if (!authed) return <AccessGate onUnlock={() => setAuthed(true)} />;
      return <DeviceFrame><App /></DeviceFrame>;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
  </script>
</body>
</html>
